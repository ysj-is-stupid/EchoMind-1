      chat:
        options:
          model: qwen-turbo
    mcp:
      client:
        stdio:
          connections:
            steam-mcp:
              command: node
              args:
                #TODO:想办法改成相对路径
                # 这里一定要换成 steam_mcp.js 的绝对路径
                - "F:/Other_Code/SpringAi1/MCP/steam/steam_mcp.js"
                - "--api-key"
                - "B4F83D26524686257CECF2DAA50AA47B"
  logging:
    level:
      org.springframework.ai: debug
      com.alibaba.cloud.ai: debug



  datasource:
    url: jdbc:mysql://localhost:3306/ai_girlfriend?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
